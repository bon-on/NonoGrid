<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NonoGrid: a nonogram logic puzzle with generated, line-solvable levels.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NonoGrid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NonoGrid</title>
  <meta name="theme-color" content="#161925">
  <link rel="manifest" href="manifest.json">
  <style>body { background-color: #B98B5C; }</style>
  <style>
    :root { --games-nav-height: calc(48px + env(safe-area-inset-top)); }
    /* Flutter renders into this host, which starts below the nav bar. */
    #flutter-host {
      position: fixed;
      inset: var(--games-nav-height) 0 0 0;
    }
    .games-nav-bar {
      position: fixed;
      z-index: 2147483647;
      inset: 0 0 auto;
      height: var(--games-nav-height);
      padding: env(safe-area-inset-top) 12px 0;
      display: flex;
      align-items: center;
      background: #161925;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      box-sizing: border-box;
    }
    .games-home-link {
      padding: 8px 12px;
      border-radius: 999px;
      color: white;
      background: rgba(255, 255, 255, .1);
      font: 600 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
    }
    .games-home-link:focus-visible { outline: 3px solid #d4af37; outline-offset: 2px; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* First-frame splash: drawn by the browser before any Flutter file has
       loaded, in the desk colours of the default theme so the hand-off to
       the game is seamless (feature-portal-quality-pass). */
    #loader {
      position: fixed;
      inset: var(--games-nav-height) 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 40%, #D8B184, #B98B5C 75%);
      color: #233059;
      font-family: Roboto, Arial, sans-serif;
      z-index: 1;
      transition: opacity .25s ease-out;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .card {
      display: grid;
      grid-template-columns: repeat(5, 14px);
      gap: 3px;
      padding: 14px;
      background: #FBF6EA;
      border: 2px solid #233059;
      border-radius: 10px;
      box-shadow: 0 4px 0 #233059;
    }
    #loader .card i {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: #EDE3CC;
    }
    /* Fills the heart once; no endless animation on the board. */
    #loader .card i.on { animation: ink .3s ease-out forwards; }
    @keyframes ink { to { background: #E8704F; } }
    #loader .title { font-size: 30px; font-weight: 900; letter-spacing: .5px; }
    #loader .bar {
      width: 160px;
      height: 6px;
      border-radius: 3px;
      background: rgba(35, 48, 89, .18);
      overflow: hidden;
    }
    #loader .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #233059;
      animation: slide 1.1s ease-in-out infinite alternate;
    }
    @keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
    @media (prefers-reduced-motion: reduce) {
      #loader .card i.on { animation: none; background: #E8704F; }
      #loader .bar span { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <nav class="games-nav-bar" aria-label="게임 내비게이션">
    <a class="games-home-link" href="https://bon-on.github.io/" aria-label="게임 선택 화면으로 돌아가기">← 게임 목록</a>
  </nav>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loader" role="status" aria-label="Loading NonoGrid">
    <div class="card" aria-hidden="true">
      <i></i><i class="on" style="animation-delay:.1s"></i><i></i><i class="on" style="animation-delay:.15s"></i><i></i>
      <i class="on" style="animation-delay:.2s"></i><i class="on" style="animation-delay:.25s"></i><i class="on" style="animation-delay:.3s"></i><i class="on" style="animation-delay:.35s"></i><i class="on" style="animation-delay:.4s"></i>
      <i class="on" style="animation-delay:.45s"></i><i class="on" style="animation-delay:.5s"></i><i class="on" style="animation-delay:.55s"></i><i class="on" style="animation-delay:.6s"></i><i class="on" style="animation-delay:.65s"></i>
      <i></i><i class="on" style="animation-delay:.7s"></i><i class="on" style="animation-delay:.75s"></i><i class="on" style="animation-delay:.8s"></i><i></i>
      <i></i><i></i><i class="on" style="animation-delay:.85s"></i><i></i><i></i>
    </div>
    <div class="title">NonoGrid</div>
    <div class="bar"><span></span></div>
  </div>
  <script>
    // Remove the loader once Flutter has rendered its first frame.
    (function () {
      var done = false;
      var observer = null;
      function hide() {
        if (done) return;
        done = true;
        if (observer) observer.disconnect();
        var el = document.getElementById('loader');
        if (!el) return;
        el.classList.add('done');
        setTimeout(function () { el.remove(); }, 300);
      }
      window.addEventListener('flutter-first-frame', hide);
      document.addEventListener('flutter-first-frame', hide);
      // Safety net in case the event is missed.
      setTimeout(hide, 15000);
    })();
  </script>
  <div id="flutter-host"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
